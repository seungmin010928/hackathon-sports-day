<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체육대회 점수판</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2329;
    --muted: #5f6b76;
    --line: #dde2e7;
    --accent: #1f6feb;
    --accent-soft: #e6effd;
    --bad: #c62828;
    --bad-soft: #fdecec;
    --good: #2e7d32;
    --gold: #b7860b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0; padding: 12px 0 8px; }
  nav { display: flex; gap: 8px; padding-bottom: 10px; }
  nav button {
    flex: 1;
    padding: 10px 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px 0 48px; }
  section.tab { display: none; }
  section.tab.on { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 16px; margin: 0 0 8px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; }
  input, select {
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    min-width: 0;
  }
  .row input { flex: 1; }
  input.bad { border-color: var(--bad); background: var(--bad-soft); }
  button.btn {
    font-size: 15px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button.btn.ghost { background: var(--card); color: var(--accent); }
  button.btn.danger { background: var(--card); color: var(--bad); border-color: var(--bad); }
  button.del {
    border: none;
    background: none;
    color: var(--bad);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .notice {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0 0 12px;
    padding: 10px 12px;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-soft);
    font-size: 14px;
  }
  .notice b { font-size: 15px; }
  .msg { min-height: 0; margin: 8px 0 0; font-size: 14px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .msg ul { margin: 0; padding-left: 20px; }
  ul.items { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.items li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0 6px 4px;
    border-bottom: 1px solid var(--line);
  }
  ul.items li:last-child { border-bottom: none; }
  ul.items li > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .event-label { display: flex; align-items: center; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  button.del { flex: none; white-space: nowrap; }
  button.handle {
    flex: none;
    width: 36px;
    height: 36px;
    margin-right: 6px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font-size: 18px;
    cursor: grab;
    touch-action: none;
  }
  button.handle:active { cursor: grabbing; }
  #event-list li { background: var(--card); }
  #event-list li.dragging {
    position: relative;
    z-index: 5;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
  }
  #event-list li.dragging .handle { color: var(--accent); }
  body.no-select { user-select: none; -webkit-user-select: none; }
  .order {
    display: inline-block;
    flex: none;
    min-width: 52px;
    margin-right: 8px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    line-height: 22px;
    text-align: center;
  }
  .bonus-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 20px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--line);
    font-size: 15px;
    font-weight: 700;
  }
  .bonus-sum { font-size: 13px; font-weight: 600; color: var(--muted); }
  ul.bonus-list { margin-top: 0; }
  ul.bonus-list li { gap: 10px; padding: 8px 0; }
  ul.items li > span.bonus-class {
    flex: none;
    min-width: 44px;
    padding: 0 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    line-height: 26px;
    text-align: center;
  }
  .bonus-reason { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .bonus-pts { flex: none; color: var(--good); font-weight: 700; font-variant-numeric: tabular-nums; }
  .bonus-pts.minus, #total-table td.pts-bonus.minus { color: var(--bad); }
  .seg-row { display: flex; gap: 8px; margin-bottom: 8px; }
  button.seg {
    flex: 1;
    padding: 10px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.seg.plus.on { background: var(--good); border-color: var(--good); color: #fff; }
  button.seg.minus.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.btn.minus { background: var(--bad); border-color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .rank-row {
    display: grid;
    grid-template-columns: 1fr 96px 56px;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row input { width: 100%; text-align: center; }
  .pts { color: var(--muted); font-size: 14px; text-align: right; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #total-table table { table-layout: fixed; }
  #total-table th:nth-child(1) { width: 19%; }
  #total-table th:nth-child(2) { width: 22%; }
  #total-table th:nth-child(3) { width: 21%; }
  #total-table th:nth-child(4) { width: 20%; }
  #total-table th:nth-child(5) { width: 18%; }
  #total-table th { white-space: nowrap; }
  #total-table th, #total-table td { padding: 8px 4px; word-break: keep-all; overflow-wrap: anywhere; }
  #total-table tbody tr { background: var(--card); }
  #total-table tbody td { font-weight: 700; }
  #total-table tbody tr.moving { position: relative; z-index: 2; }
  #total-table tbody td { transition: background-color .4s; }
  #total-table tbody tr.changed td { background: #fff3c4; }
  #total-table tbody tr.rising td { background: #cfe0ff; box-shadow: 0 6px 12px -6px rgba(31, 111, 235, .6); }
  #total-table .gap { display: block; font-size: 12px; font-weight: 600; color: var(--bad); white-space: nowrap; line-height: 1.3; }
  #total-table td.bump { color: var(--accent); font-weight: 800; }
  .delta {
    display: inline-block;
    margin-left: 3px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--good);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    line-height: 20px;
    vertical-align: middle;
    animation: badge-in .5s ease-out;
  }
  .move {
    display: inline-block;
    margin-left: 3px;
    padding: 0 5px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    line-height: 20px;
    vertical-align: middle;
    animation: badge-in .5s ease-out;
  }
  .move.up { color: #fff; background: var(--good); }
  .move.down { color: #fff; background: var(--bad); }
  @keyframes badge-in { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  tr.first td { font-weight: 700; }
  /* 1~3위 금·은·동 표시 */
  .medal {
    display: inline-block;
    min-width: 36px;
    padding: 0 6px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-weight: 700;
    line-height: 24px;
    text-align: center;
  }
  .medal.m1 { background: #f7e08a; border-color: #d4a72c; color: #6b4e00; }
  .medal.m2 { background: #e3e7ec; border-color: #a7b0ba; color: #3f4a55; }
  .medal.m3 { background: #f0d2b6; border-color: #c08552; color: #6b3b12; }
  .tie { font-size: 12px; color: var(--muted); margin-left: 4px; }
  #total-table .tie { display: block; margin-left: 0; white-space: nowrap; line-height: 1.2; }
  .event-block { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .event-block:last-child { border-bottom: none; }
  .event-block ol { margin: 0; padding: 0; list-style: none; }
  .event-block li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .missing { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* ---------- 순위표: 종합운동장 전광판 ---------- */
  .board {
    --digital: Consolas, "DejaVu Sans Mono", Menlo, "Courier New", monospace;
    --led: #ffb000;
    --led-glow: rgba(255, 176, 0, .55);
    --board-bg: #0a0c0f;
    position: relative;
    overflow: hidden;
    padding: 14px 12px 12px;
    background: var(--board-bg);
    border: 6px solid #262b33;
    border-radius: 14px;
    box-shadow: inset 0 0 0 1px #000, 0 8px 20px rgba(0, 0, 0, .35);
    color: #e8edf2;
  }
  /* LED 점 무늬 */
  .board::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.5px);
    background-size: 4px 4px;
    pointer-events: none;
  }
  .board-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 2px solid #262b33;
  }
  .board .board-title {
    margin: 0;
    color: #fff;
    font-size: 19px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(255, 255, 255, .45);
  }
  .board-live {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ff4040;
    font: 700 13px var(--digital);
    letter-spacing: 2px;
    text-shadow: 0 0 6px #ff4040;
  }
  .board-live i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff4040;
    box-shadow: 0 0 8px #ff4040;
    animation: blink 1.2s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: .2; } }
  .board-progress {
    position: relative;
    margin: 8px 0 4px;
    padding: 5px 0;
    overflow: hidden;
    border-top: 1px solid #262b33;
    border-bottom: 1px solid #262b33;
    background: #07080a;
    color: var(--led);
    font: 700 14px var(--digital);
    letter-spacing: 1px;
    white-space: nowrap;
    text-shadow: 0 0 6px var(--led-glow);
  }
  .ticker-track { display: inline-flex; animation: ticker 40s linear infinite; }
  .ticker-run { display: inline-flex; }
  .ticker-dot { padding: 0 18px; color: #ff4040; text-shadow: 0 0 6px #ff4040; font-size: 10px; line-height: 20px; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }
  .board-hint { position: relative; margin: 10px 0 0; color: #7d8792; font-size: 12px; line-height: 1.5; }
  .board #total-table th {
    color: #8b95a1;
    font-size: 12px;
    letter-spacing: 1px;
    border-bottom: 1px solid #2a2f37;
  }
  .board #total-table td { border-bottom: 1px solid #1b1f25; color: #f2f5f8; }
  .board #total-table tbody tr { background: var(--board-bg); }
  .board #total-table td.name { font-size: 17px; }
  .board #total-table td.num {
    font-family: var(--digital);
    font-size: 17px;
    color: var(--led);
    text-shadow: 0 0 6px var(--led-glow);
  }
  .board #total-table td.pts-total {
    font-size: 19px;
    color: #ffe14d;
    text-shadow: 0 0 8px rgba(255, 225, 77, .7);
  }
  .board #total-table td.pts-bonus.minus { color: #ff5a5a; text-shadow: 0 0 6px rgba(255, 90, 90, .6); }
  .board #total-table .gap { font-family: var(--digital); color: #ff5a5a; text-shadow: 0 0 5px rgba(255, 90, 90, .6); }
  .board #total-table .tie { color: #8b95a1; }
  .board #total-table td.bump { color: #5ff1ff; text-shadow: 0 0 8px #5ff1ff; }
  .board #total-table tbody tr.changed td { background: rgba(255, 176, 0, .14); }
  .board #total-table tbody tr.rising td { background: #123a73; box-shadow: 0 6px 14px -6px rgba(64, 140, 255, .9); }
  .board .medal {
    background: transparent;
    border-color: #3a414b;
    color: #9aa4ae;
    font-family: var(--digital);
  }
  .board .medal.m1 { border-color: #ffd84d; color: #ffd84d; text-shadow: 0 0 8px rgba(255, 216, 77, .8); box-shadow: 0 0 8px rgba(255, 216, 77, .35); }
  .board .medal.m2 { border-color: #dfe7ef; color: #dfe7ef; text-shadow: 0 0 8px rgba(223, 231, 239, .7); box-shadow: 0 0 8px rgba(223, 231, 239, .25); }
  .board .medal.m3 { border-color: #ff9d5c; color: #ff9d5c; text-shadow: 0 0 8px rgba(255, 157, 92, .8); box-shadow: 0 0 8px rgba(255, 157, 92, .3); }
  .board .empty { color: #8b95a1; }
  @media (prefers-reduced-motion: reduce) { .board-live i { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>체육대회 점수판</h1>
    <nav>
      <button type="button" data-tab="setup" class="on">① 반·종목 등록</button>
      <button type="button" data-tab="input">② 결과 입력</button>
      <button type="button" data-tab="rank">③ 순위표</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- 화면 ①: 반·종목 등록 -->
  <section class="tab on" id="tab-setup">
    <div class="card">
      <h2>참가 반</h2>
      <p class="hint">예: 1A, 1B, 2A</p>
      <form class="row" id="class-form">
        <input id="class-name" placeholder="반 이름" maxlength="20" autocomplete="off">
        <button class="btn" type="submit">추가</button>
      </form>
      <div class="msg" id="class-msg"></div>
      <ul class="items" id="class-list"></ul>
    </div>

    <div class="card">
      <h2>종목</h2>
      <p class="hint">예: 축구, 피구, 계주 · 왼쪽 ☰를 끌어서 순서를 바꿀 수 있어요.</p>
      <form class="row" id="event-form">
        <input id="event-name" placeholder="종목 이름" maxlength="20" autocomplete="off">
        <button class="btn" type="submit">추가</button>
      </form>
      <div class="msg" id="event-msg"></div>
      <ul class="items" id="event-list"></ul>
    </div>

    <div class="card">
      <h2>데이터 관리</h2>
      <p class="hint">처음 써 보는 경우 예시 데이터를 넣어 보세요. 예시는 모두 가짜 데이터입니다.</p>
      <div class="actions">
        <button class="btn ghost" type="button" id="sample-btn">예시 데이터 넣기</button>
        <button class="btn danger" type="button" id="reset-btn">전체 초기화</button>
      </div>
      <div class="msg" id="data-msg"></div>
    </div>
  </section>

  <!-- 화면 ②: 결과 입력 -->
  <section class="tab" id="tab-input">
    <div class="card" id="input-card"></div>
    <div class="card" id="bonus-card"></div>
  </section>

  <!-- 화면 ③: 순위표 -->
  <section class="tab" id="tab-rank">
    <div class="card board" id="rank-board">
      <div class="board-top">
        <h2 class="board-title">실시간 종합 순위</h2>
        <span class="board-live"><i></i>LIVE</span>
      </div>
      <div class="board-progress" id="board-progress"></div>
      <div id="total-table"></div>
      <p class="board-hint">종목 점수: 1등 10점 · 2등 7점 · 3등 5점 · 4등부터 3점<br>총점 = 종목 점수 + 특별점수 · 총점이 같으면 같은 순위</p>
    </div>
    <div class="card">
      <h2>종목별 결과</h2>
      <div id="event-results"></div>
    </div>
  </section>
</main>

<script>
  const STORAGE_KEY = 'sportsScoreboard.v1';
  const MAX_NAME = 20;
  const MAX_BONUS = 100;

  // 등수 → 점수
  function pointsFor(rank) {
    if (rank === 1) return 10;
    if (rank === 2) return 7;
    if (rank === 3) return 5;
    return 3;
  }

  // ---------- 저장 / 불러오기 ----------
  function emptyState() {
    return { classes: [], events: [], results: {}, bonuses: [], nextId: 1 };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      const d = JSON.parse(raw);
      if (!d || !Array.isArray(d.classes) || !Array.isArray(d.events) ||
          typeof d.results !== 'object' || d.results === null) {
        return emptyState();
      }
      if (!Number.isInteger(d.nextId)) d.nextId = 1;
      if (!Array.isArray(d.bonuses)) d.bonuses = [];
      return d;
    } catch (e) {
      return emptyState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      alert('브라우저에 저장하지 못했어요. 시크릿 창이거나 저장 공간이 꽉 찼을 수 있어요.');
      return false;
    }
  }

  // 반 이름 정렬: 숫자는 크기 순서(2 다음 10), 한글은 가나다순
  const nameOrder = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });
  function sortClasses() {
    state.classes.sort((a, b) => nameOrder.compare(a.name, b.name));
  }

  let state = loadState();
  sortClasses();
  let currentEventId = null;

  function newId(prefix) {
    return prefix + (state.nextId++);
  }

  // ---------- 작은 도우미 ----------
  function $(id) { return document.getElementById(id); }

  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      for (const k in props) {
        if (k === 'text') node.textContent = props[k];
        else if (k === 'className') node.className = props[k];
        else node.setAttribute(k, props[k]);
      }
    }
    (children || []).forEach(c => { if (c) node.appendChild(c); });
    return node;
  }

  function showMsg(box, kind, lines) {
    box.className = 'msg ' + kind;
    box.textContent = '';
    if (!lines || lines.length === 0) return;
    if (lines.length === 1) { box.textContent = lines[0]; return; }
    const ul = el('ul');
    lines.forEach(t => ul.appendChild(el('li', { text: t })));
    box.appendChild(ul);
  }

  function className(id) {
    const c = state.classes.find(x => x.id === id);
    return c ? c.name : '';
  }

  // ---------- 화면 이동 ----------
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });

  function currentTab() {
    return document.querySelector('nav button.on').dataset.tab;
  }

  // 결과 입력 화면에 저장하지 않은 등수가 있는지
  function hasUnsavedInput() {
    if (!currentEventId) return false;
    const saved = state.results[currentEventId] || {};
    return Array.from(document.querySelectorAll('#input-card .rank-row input')).some(input => {
      const before = saved[input.dataset.classId] !== undefined ? String(saved[input.dataset.classId]) : '';
      return input.value.trim() !== before;
    });
  }

  function okToLeaveInput() {
    if (!hasUnsavedInput()) return true;
    return confirm('저장하지 않은 등수가 있어요.\n저장 버튼을 누르지 않고 넘어가면 입력한 내용이 사라져요.\n그래도 넘어갈까요?');
  }

  window.addEventListener('beforeunload', e => {
    if (currentTab() === 'input' && hasUnsavedInput()) { e.preventDefault(); e.returnValue = ''; }
  });

  function showTab(name) {
    if (name === currentTab()) return;
    if (currentTab() === 'input' && !okToLeaveInput()) return;
    if (name === 'input') pickNextEvent();
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
    renderAll();
    window.scrollTo(0, 0);
    if (name === 'rank') animateRank();
    else animToken++;
  }

  // ---------- 화면 ①: 반·종목 등록 ----------
  function checkName(list, raw, label) {
    const name = raw.trim().replace(/\s+/g, ' ');
    if (name === '') return { error: label + ' 이름을 적어 주세요.' };
    if (name.length > MAX_NAME) return { error: label + ' 이름은 ' + MAX_NAME + '글자까지 쓸 수 있어요.' };
    const same = list.some(x => x.name.toLowerCase() === name.toLowerCase());
    if (same) return { error: '"' + name + '"은(는) 이미 등록된 ' + label + '이에요.' };
    return { name: name };
  }

  $('class-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('class-name');
    const r = checkName(state.classes, input.value, '반');
    if (r.error) { input.classList.add('bad'); showMsg($('class-msg'), 'err', [r.error]); return; }
    state.classes.push({ id: newId('c'), name: r.name });
    sortClasses();
    saveState();
    input.value = '';
    input.classList.remove('bad');
    showMsg($('class-msg'), 'ok', [r.name + ' 반을 추가했어요.']);
    renderAll();
    input.focus();
  });

  $('event-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('event-name');
    const r = checkName(state.events, input.value, '종목');
    if (r.error) { input.classList.add('bad'); showMsg($('event-msg'), 'err', [r.error]); return; }
    state.events.push({ id: newId('e'), name: r.name });
    saveState();
    input.value = '';
    input.classList.remove('bad');
    showMsg($('event-msg'), 'ok', [r.name + ' 종목을 추가했어요.']);
    renderAll();
    input.focus();
  });

  ['class-name', 'event-name'].forEach(id => {
    $(id).addEventListener('input', () => $(id).classList.remove('bad'));
  });

  function deleteClass(id) {
    const name = className(id);
    const affected = state.events.filter(ev => state.results[ev.id] && state.results[ev.id][id] !== undefined);
    let ask = name + ' 반을 삭제할까요?';
    if (affected.length > 0) {
      ask += '\n이 반의 결과 ' + affected.length + '개(' + affected.map(e => e.name).join(', ') + ')도 함께 지워져요.';
    }
    const bonusCount = state.bonuses.filter(b => b.classId === id).length;
    if (bonusCount > 0) ask += '\n이 반의 특별 점수 ' + bonusCount + '개도 함께 지워져요.';
    if (!confirm(ask)) return;

    state.classes = state.classes.filter(c => c.id !== id);
    state.bonuses = state.bonuses.filter(b => b.classId !== id);
    const n = state.classes.length;
    let cleared = 0;
    for (const evId in state.results) {
      const res = state.results[evId];
      delete res[id];
      // 반 수가 줄어서 범위를 넘게 된 등수는 지운다
      for (const cId in res) {
        if (res[cId] > n) { delete res[cId]; cleared++; }
      }
      if (Object.keys(res).length === 0) delete state.results[evId];
    }
    saveState();
    const lines = [name + ' 반을 삭제했어요.'];
    if (cleared > 0) lines.push('반 수가 ' + n + '개로 줄어서, ' + n + '등보다 큰 등수 ' + cleared + '개도 지웠어요. 결과 입력 화면에서 다시 확인해 주세요.');
    showMsg($('class-msg'), cleared > 0 ? 'err' : 'ok', lines);
    renderAll();
  }

  function deleteEvent(id) {
    const ev = state.events.find(e => e.id === id);
    const res = state.results[id];
    let ask = ev.name + ' 종목을 삭제할까요?';
    if (res && Object.keys(res).length > 0) ask += '\n입력해 둔 이 종목의 결과도 함께 지워져요.';
    if (!confirm(ask)) return;
    state.events = state.events.filter(e => e.id !== id);
    delete state.results[id];
    if (currentEventId === id) currentEventId = null;
    saveState();
    showMsg($('event-msg'), 'ok', [ev.name + ' 종목을 삭제했어요.']);
    renderAll();
  }

  // 종목 순서 바꾸기: from번째 종목을 to번째 자리로
  function moveEvent(from, to) {
    if (to < 0 || to >= state.events.length || to === from) return;
    const moved = state.events.splice(from, 1)[0];
    state.events.splice(to, 0, moved);
    saveState();
    showMsg($('event-msg'), 'ok', [moved.name + ' 종목을 ' + (to + 1) + '종목으로 옮겼어요.']);
    renderAll();
    // 키보드로 계속 옮길 수 있게 옮긴 종목의 손잡이에 다시 초점
    document.querySelectorAll('#event-list li')[to].querySelector('.handle').focus();
  }

  // 손잡이를 끌어서 옮기기 (마우스·손가락 모두)
  function startEventDrag(e, li, from) {
    if (e.button !== 0) return;
    e.preventDefault();
    const handle = e.currentTarget;
    const items = Array.from(document.querySelectorAll('#event-list li'));
    const mids = items.map(x => { const r = x.getBoundingClientRect(); return r.top + window.scrollY + r.height / 2; });
    const h = li.getBoundingClientRect().height;
    const startY = e.pageY;
    let to = from;
    handle.setPointerCapture(e.pointerId);
    li.classList.add('dragging');
    document.body.classList.add('no-select');
    items.forEach(x => { if (x !== li) x.style.transition = 'transform .15s'; });

    const onMove = ev => {
      const dy = ev.pageY - startY;
      li.style.transform = 'translateY(' + dy + 'px)';
      // 끌고 있는 종목의 가운데가 다른 종목의 가운데를 넘으면 자리를 바꾼다
      const center = mids[from] + dy;
      to = from;
      mids.forEach((m, k) => {
        if (k < from && center < m) to = Math.min(to, k);
        if (k > from && center > m) to = Math.max(to, k);
      });
      items.forEach((x, k) => {
        if (k === from) return;
        let shift = 0;
        if (from < to && k > from && k <= to) shift = -h;
        if (from > to && k < from && k >= to) shift = h;
        x.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
      // 화면 끝에 가까우면 자동으로 스크롤
      if (ev.clientY < 60) window.scrollBy(0, -12);
      else if (ev.clientY > window.innerHeight - 60) window.scrollBy(0, 12);
    };
    const onEnd = ev => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      document.body.classList.remove('no-select');
      if (ev.type === 'pointerup' && to !== from) moveEvent(from, to);
      else renderSetup();
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
  }

  function renderSetup() {
    const cl = $('class-list');
    cl.textContent = '';
    if (state.classes.length === 0) cl.appendChild(el('li', { className: 'empty', text: '아직 등록된 반이 없어요.' }));
    state.classes.forEach(c => {
      const del = el('button', { className: 'del', type: 'button', text: '삭제' });
      del.addEventListener('click', () => deleteClass(c.id));
      cl.appendChild(el('li', null, [el('span', { text: c.name }), del]));
    });

    const evl = $('event-list');
    evl.textContent = '';
    if (state.events.length === 0) evl.appendChild(el('li', { className: 'empty', text: '아직 등록된 종목이 없어요.' }));
    state.events.forEach((ev, i) => {
      const del = el('button', { className: 'del', type: 'button', text: '삭제' });
      del.addEventListener('click', () => deleteEvent(ev.id));
      const handle = el('button', { className: 'handle', type: 'button', text: '☰', 'aria-label': ev.name + ' 순서 옮기기 (끌어서 옮기거나 위아래 화살표 키)' });
      const li = el('li', null, [
        handle,
        el('span', { className: 'event-label' }, [el('span', { className: 'order', text: (i + 1) + '종목' }), el('span', { text: ev.name })]),
        del
      ]);
      handle.addEventListener('pointerdown', e => startEventDrag(e, li, i));
      handle.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') { e.preventDefault(); moveEvent(i, i - 1); }
        if (e.key === 'ArrowDown') { e.preventDefault(); moveEvent(i, i + 1); }
      });
      evl.appendChild(li);
    });
  }

  $('sample-btn').addEventListener('click', () => {
    const hasData = state.classes.length > 0 || state.events.length > 0;
    if (hasData && !confirm('지금 있는 데이터를 모두 지우고 예시 데이터를 넣을까요?')) return;
    state = emptyState();
    // 예시 데이터 (모두 가짜 이름) · 계주는 결과를 비워 둬서 직접 입력해 볼 수 있다
    const ids = {};
    ['백호팀', '주작팀', '청룡팀', '현무팀', '황룡팀'].forEach(n => { ids[n] = newId('c'); state.classes.push({ id: ids[n], name: n }); });
    const evs = {};
    ['축구', '피구', '씨름', '계주'].forEach(n => { evs[n] = newId('e'); state.events.push({ id: evs[n], name: n }); });
    state.results[evs['축구']] = { [ids['주작팀']]: 1, [ids['청룡팀']]: 2, [ids['현무팀']]: 3, [ids['황룡팀']]: 4, [ids['백호팀']]: 5 };
    state.results[evs['피구']] = { [ids['백호팀']]: 1, [ids['청룡팀']]: 2, [ids['주작팀']]: 3, [ids['현무팀']]: 4, [ids['황룡팀']]: 5 };
    state.results[evs['씨름']] = { [ids['현무팀']]: 1, [ids['주작팀']]: 2, [ids['청룡팀']]: 3, [ids['황룡팀']]: 4, [ids['백호팀']]: 5 };
    state.bonuses.push({ id: newId('b'), classId: ids['현무팀'], reason: '응원', points: 11 });
    state.bonuses.push({ id: newId('b'), classId: ids['주작팀'], reason: '잘생김', points: 10 });
    state.bonuses.push({ id: newId('b'), classId: ids['현무팀'], reason: '지각', points: -20 });
    currentEventId = null;
    saveState();
    showMsg($('data-msg'), 'ok', ['예시 데이터를 넣었어요. ③ 순위표에서 확인해 보세요.']);
    renderAll();
  });

  $('reset-btn').addEventListener('click', () => {
    if (!confirm('반, 종목, 결과를 모두 지울까요? 되돌릴 수 없어요.')) return;
    state = emptyState();
    currentEventId = null;
    saveState();
    showMsg($('data-msg'), 'ok', ['모든 데이터를 지웠어요.']);
    renderAll();
  });

  // ---------- 화면 ②: 결과 입력 ----------
  // ---------- 다음에 입력할 종목 자동 선택 ----------
  let inputNotice = null; // 결과 입력 화면 위쪽 안내

  function hasResult(eventId) {
    const r = state.results[eventId];
    return !!r && Object.keys(r).length > 0;
  }

  function eventLabel(eventId) {
    const i = state.events.findIndex(e => e.id === eventId);
    return (i + 1) + '종목 · ' + state.events[i].name;
  }

  // 결과 입력 화면에 들어올 때: 지금 종목이 이미 저장돼 있으면 결과가 없는 가장 앞 종목으로
  function pickNextEvent() {
    inputNotice = null;
    if (state.classes.length === 0 || state.events.length === 0) return;
    const cur = state.events.some(e => e.id === currentEventId) ? currentEventId : null;
    const done = state.events.filter(e => hasResult(e.id)).length;
    if (cur && !hasResult(cur)) { // 아직 입력 중인 종목은 그대로
      inputNotice = { next: cur, done: done };
      return;
    }
    const next = state.events.find(e => !hasResult(e.id));
    if (next) {
      inputNotice = { prev: cur, next: next.id, done: done };
      currentEventId = next.id;
    } else {
      inputNotice = { allDone: true, done: done };
    }
  }

  function renderInput() {
    const card = $('input-card');
    card.textContent = '';
    card.appendChild(el('h2', { text: '종목 결과 입력' }));

    if (state.classes.length === 0 || state.events.length === 0) {
      card.appendChild(el('p', { className: 'empty', text: '먼저 ① 반·종목 등록 화면에서 반과 종목을 하나 이상 등록해 주세요.' }));
      return;
    }
    if (!state.events.some(e => e.id === currentEventId)) currentEventId = state.events[0].id;

    const n = state.classes.length;
    card.appendChild(el('p', {
      className: 'hint',
      text: '등수는 1부터 ' + n + '까지 적어요. 참가하지 않은 반은 비워 두면 돼요. 한 종목 안에서 같은 등수는 한 반만 가질 수 있어요.'
    }));

    const select = el('select', { 'aria-label': '종목 선택' });
    select.style.width = '100%';
    state.events.forEach((ev, i) => {
      const opt = el('option', { value: ev.id, text: (i + 1) + '종목 · ' + ev.name });
      if (ev.id === currentEventId) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      if (!okToLeaveInput()) { select.value = currentEventId; return; }
      currentEventId = select.value;
      inputNotice = null;
      renderInput();
    });
    if (inputNotice) {
      const total = state.events.length;
      const lines = [];
      if (inputNotice.allDone) {
        lines.push(el('b', { text: '모든 종목(' + total + '개)의 결과가 입력됐어요.' }));
        lines.push(el('span', { text: '고칠 종목이 있으면 아래에서 골라 주세요.' }));
      } else {
        if (inputNotice.prev) lines.push(el('span', { text: '✓ ' + eventLabel(inputNotice.prev) + ' 결과는 저장되어 있어요.' }));
        lines.push(el('b', { text: '이번 차례: ' + eventLabel(inputNotice.next) }));
        lines.push(el('span', { text: '입력 완료 ' + inputNotice.done + ' / ' + total + '종목 · 다른 종목은 아래에서 바꿀 수 있어요.' }));
      }
      card.appendChild(el('div', { className: 'notice' }, lines));
    }
    card.appendChild(select);

    const saved = state.results[currentEventId] || {};
    const msg = el('div', { className: 'msg' });
    const list = el('div');
    list.style.marginTop = '12px';
    const inputs = [];
    state.classes.forEach(c => {
      const input = el('input', {
        inputmode: 'numeric',
        autocomplete: 'off',
        placeholder: '1~' + n,
        maxlength: String(n).length,
        'data-class-id': c.id,
        'aria-label': c.name + ' 등수'
      });
      input.value = saved[c.id] !== undefined ? String(saved[c.id]) : '';
      let lastOk = input.value;
      const pts = el('span', { className: 'pts' });
      const updatePts = () => {
        input.classList.remove('bad');
        // 숫자만 남기고, 1~반 수를 벗어나면 입력 전 값으로 되돌린다
        const digits = input.value.replace(/\D/g, '');
        if (digits !== '' && (Number(digits) < 1 || Number(digits) > n)) {
          input.value = lastOk;
          showMsg(msg, 'err', ['등수는 1부터 ' + n + '까지만 넣을 수 있어요. (등록된 반 ' + n + '개)']);
        } else {
          input.value = digits;
          lastOk = digits;
        }
        const v = input.value.trim();
        if (/^\d+$/.test(v) && Number(v) >= 1 && Number(v) <= n) pts.textContent = pointsFor(Number(v)) + '점';
        else pts.textContent = '';
      };
      input.addEventListener('input', updatePts);
      updatePts();
      inputs.push({ classId: c.id, name: c.name, input: input });
      list.appendChild(el('div', { className: 'rank-row' }, [el('span', { text: c.name }), input, pts]));
    });
    card.appendChild(list);

    const saveBtn = el('button', { className: 'btn', type: 'button', text: '저장' });
    const clearBtn = el('button', { className: 'btn danger', type: 'button', text: '이 종목 결과 지우기' });
    card.appendChild(el('div', { className: 'actions' }, [saveBtn, clearBtn]));
    card.appendChild(msg);

    saveBtn.addEventListener('click', () => {
      const errors = [];
      const entries = {};
      const usedBy = {};
      inputs.forEach(row => {
        const v = row.input.value.trim();
        if (v === '') return;
        if (!/^\d+$/.test(v)) {
          row.input.classList.add('bad');
          errors.push(row.name + ': "' + v + '"은(는) 쓸 수 없어요. 1, 2, 3 같은 자연수로 적어 주세요.');
          return;
        }
        const r = Number(v);
        if (r < 1 || r > n) {
          row.input.classList.add('bad');
          errors.push(row.name + ': 등수는 1부터 ' + n + '까지만 넣을 수 있어요.');
          return;
        }
        if (usedBy[r]) {
          row.input.classList.add('bad');
          usedBy[r].input.classList.add('bad');
          errors.push(r + '등이 ' + usedBy[r].name + '와(과) ' + row.name + '에 겹쳐요. 같은 등수는 한 반만 가질 수 있어요.');
          return;
        }
        usedBy[r] = row;
        entries[row.classId] = r;
      });

      if (errors.length > 0) { showMsg(msg, 'err', errors); return; }

      const evName = state.events.find(e => e.id === currentEventId).name;
      if (Object.keys(entries).length === 0) {
        showMsg(msg, 'err', ['등수를 하나 이상 넣어 주세요. 결과를 지우려면 "이 종목 결과 지우기"를 누르세요.']);
        return;
      }
      state.results[currentEventId] = entries;
      if (saveState()) {
        inputNotice = null;
        const notice = card.querySelector('.notice');
        if (notice) notice.remove();
        showMsg(msg, 'ok', [evName + ' 결과를 저장했어요. (' + Object.keys(entries).length + '개 반)', '③ 순위표에서 바뀐 순위를 확인해 보세요.']);
      }
    });

    clearBtn.addEventListener('click', () => {
      const evName = state.events.find(e => e.id === currentEventId).name;
      if (!state.results[currentEventId]) {
        inputs.forEach(row => { row.input.value = ''; row.input.dispatchEvent(new Event('input')); });
        showMsg(msg, 'ok', ['지울 결과가 없어요.']);
        return;
      }
      if (!confirm(evName + ' 결과를 모두 지울까요?')) return;
      delete state.results[currentEventId];
      saveState();
      renderInput();
      showMsg($('input-card').querySelector('.msg'), 'ok', [evName + ' 결과를 지웠어요.']);
    });
  }

  // ---------- 화면 ②: 특별 점수 ----------
  let bonusMode = 'plus'; // 'plus' = 가산점, 'minus' = 감점 (다시 그려도 고른 것 유지)

  function signed(n) {
    return (n > 0 ? '+' : '') + n;
  }

  function renderBonus() {
    const card = $('bonus-card');
    card.textContent = '';
    card.appendChild(el('h2', { text: '특별 점수' }));
    if (state.classes.length === 0) {
      card.appendChild(el('p', { className: 'empty', text: '먼저 ① 반·종목 등록 화면에서 반을 등록해 주세요.' }));
      return;
    }
    card.appendChild(el('p', {
      className: 'hint',
      text: '종목 말고 따로 주는 점수예요. 응원처럼 잘한 일은 가산점, 질서 위반처럼 잘못한 일은 감점으로 1점부터 ' + MAX_BONUS + '점까지 줄 수 있어요.'
    }));

    const select = el('select', { 'aria-label': '특별 점수 받을 반' });
    select.style.width = '100%';
    state.classes.forEach(c => select.appendChild(el('option', { value: c.id, text: c.name })));
    const reason = el('input', { placeholder: '이유 (예: 응원)', maxlength: MAX_NAME, autocomplete: 'off', 'aria-label': '특별 점수 이유' });
    const points = el('input', { placeholder: '점수', inputmode: 'numeric', autocomplete: 'off', maxlength: String(MAX_BONUS).length, 'aria-label': '특별 점수' });
    points.style.width = '88px';
    points.style.flex = 'none';
    const addBtn = el('button', { className: 'btn', type: 'submit', text: '추가' });

    // 가산점 / 감점 고르기
    const plusBtn = el('button', { type: 'button', className: 'seg plus', text: '+ 가산점' });
    const minusBtn = el('button', { type: 'button', className: 'seg minus', text: '− 감점' });
    const setMode = mode => {
      bonusMode = mode;
      plusBtn.classList.toggle('on', mode === 'plus');
      minusBtn.classList.toggle('on', mode === 'minus');
      plusBtn.setAttribute('aria-pressed', String(mode === 'plus'));
      minusBtn.setAttribute('aria-pressed', String(mode === 'minus'));
      reason.placeholder = mode === 'plus' ? '이유 (예: 응원)' : '이유 (예: 지각)';
      addBtn.textContent = mode === 'plus' ? '추가' : '감점';
      addBtn.classList.toggle('minus', mode === 'minus');
    };
    plusBtn.addEventListener('click', () => setMode('plus'));
    minusBtn.addEventListener('click', () => setMode('minus'));
    setMode(bonusMode);
    const msg = el('div', { className: 'msg' });

    // 숫자만, 최대 점수를 넘으면 입력 전 값으로 되돌린다
    let lastOk = '';
    points.addEventListener('input', () => {
      points.classList.remove('bad');
      const digits = points.value.replace(/\D/g, '');
      if (digits !== '' && (Number(digits) < 1 || Number(digits) > MAX_BONUS)) {
        points.value = lastOk;
        showMsg(msg, 'err', ['특별 점수는 1점부터 ' + MAX_BONUS + '점까지만 줄 수 있어요.']);
      } else {
        points.value = digits;
        lastOk = digits;
      }
    });
    reason.addEventListener('input', () => reason.classList.remove('bad'));

    const form = el('form', null, [
      el('div', { className: 'seg-row' }, [plusBtn, minusBtn]),
      select,
      el('div', { className: 'row' }, [reason, points, addBtn])
    ]);
    form.lastChild.style.marginTop = '8px';
    form.addEventListener('submit', e => {
      e.preventDefault();
      const errors = [];
      const why = reason.value.trim().replace(/\s+/g, ' ');
      if (why === '') { reason.classList.add('bad'); errors.push('이유를 적어 주세요. (예: ' + (bonusMode === 'plus' ? '응원' : '지각') + ')'); }
      const p = points.value.trim();
      if (!/^\d+$/.test(p) || Number(p) < 1 || Number(p) > MAX_BONUS) {
        points.classList.add('bad');
        errors.push('점수는 1부터 ' + MAX_BONUS + '까지의 자연수로 적어 주세요.');
      }
      if (errors.length > 0) { showMsg(msg, 'err', errors); return; }
      const value = bonusMode === 'plus' ? Number(p) : -Number(p);
      state.bonuses.push({ id: newId('b'), classId: select.value, reason: why, points: value });
      saveState();
      renderBonus(); renderRank();
      showMsg($('bonus-card').querySelector('.msg'), 'ok', [className(select.value) + (value > 0 ? '에 ' + why + ' ' + p + '점을 더했어요.' : '에서 ' + why + ' ' + p + '점을 뺐어요.')]);
    });
    card.appendChild(form);
    card.appendChild(msg);

    // 준 특별 점수 목록: 방금 준 것이 맨 위
    const shown = state.bonuses.filter(b => className(b.classId) !== '').slice().reverse();
    const sum = shown.reduce((acc, b) => acc + b.points, 0);
    card.appendChild(el('div', { className: 'bonus-head' }, [
      el('span', { text: '준 특별 점수' }),
      el('span', { className: 'bonus-sum', text: shown.length + '건 · 합계 ' + signed(sum) + '점' })
    ]));
    const list = el('ul', { className: 'items bonus-list' });
    if (shown.length === 0) list.appendChild(el('li', { className: 'empty', text: '아직 준 특별 점수가 없어요.' }));
    shown.forEach(b => {
      const del = el('button', { className: 'del', type: 'button', text: '삭제', 'aria-label': className(b.classId) + ' ' + b.reason + ' 삭제' });
      del.addEventListener('click', () => {
        if (!confirm(className(b.classId) + ' ' + b.reason + ' ' + signed(b.points) + '점을 지울까요?')) return;
        state.bonuses = state.bonuses.filter(x => x.id !== b.id);
        saveState();
        renderBonus(); renderRank();
      });
      list.appendChild(el('li', null, [
        el('span', { className: 'bonus-class', text: className(b.classId) }),
        el('span', { className: 'bonus-reason', text: b.reason }),
        el('span', { className: 'bonus-pts' + (b.points < 0 ? ' minus' : ''), text: signed(b.points) + '점' }),
        del
      ]));
    });
    card.appendChild(list);
  }

  // ---------- 화면 ③: 순위표 ----------
  function computeTotals() {
    const totals = state.classes.map(c => ({ id: c.id, name: c.name, eventPts: 0, bonusPts: 0, total: 0 }));
    const byId = {};
    totals.forEach(t => { byId[t.id] = t; });
    state.events.forEach(ev => {
      const res = state.results[ev.id] || {};
      for (const cId in res) {
        if (byId[cId]) byId[cId].eventPts += pointsFor(res[cId]);
      }
    });
    state.bonuses.forEach(b => {
      if (byId[b.classId]) byId[b.classId].bonusPts += b.points;
    });
    totals.forEach(t => { t.total = t.eventPts + t.bonusPts; });
    totals.sort((a, b) => b.total - a.total);
    // 같은 점수는 같은 순위, 다음 순위는 건너뜀 (1, 1, 3)
    totals.forEach(t => { t.place = 1 + totals.filter(o => o.total > t.total).length; });
    totals.forEach(t => { t.tied = totals.filter(o => o.total === t.total).length > 1; });
    return totals;
  }

  // 순위 칸 채우기: 점수가 있는 1~3위는 금·은·동 색
  function medalClass(place, hasScore) {
    return hasScore && place >= 1 && place <= 3 ? 'medal m' + place : 'medal';
  }

  function fillPlace(cell, place, tied, total) {
    cell.textContent = '';
    cell.appendChild(el('span', { className: medalClass(place, total > 0), text: place ? place + '위' : '-' }));
    if (place && tied) cell.appendChild(el('span', { className: 'tie', text: '공동' }));
  }

  // 띠 전광판: 같은 문구를 이어 붙인 줄 두 개를 왼쪽으로 흘려서 끊김 없이 반복
  function setTicker(news) {
    const box = $('board-progress');
    const label = news.join(' · ');
    if (box.getAttribute('aria-label') === label) return; // 같은 문구면 흐름을 다시 시작하지 않는다
    box.setAttribute('aria-label', label);
    box.textContent = '';
    const track = el('div', { className: 'ticker-track', 'aria-hidden': 'true' });
    for (let copy = 0; copy < 2; copy++) {
      const run = el('span', { className: 'ticker-run' });
      // 한 줄이 화면보다 길어야 끊김이 없어서 문구 묶음을 여러 번 이어 붙인다
      const repeat = Math.max(2, Math.ceil(6 / news.length));
      for (let k = 0; k < repeat; k++) {
        news.forEach(t => {
          run.appendChild(el('span', { text: t }));
          run.appendChild(el('span', { className: 'ticker-dot', text: '●' }));
        });
      }
      track.appendChild(run);
    }
    // 문구 길이에 맞춰 속도를 일정하게 (글자 하나 약 11px, 1초에 약 60px)
    const chars = track.firstChild.textContent.length;
    track.style.animationDuration = Math.max(8, chars * 11 / 60).toFixed(1) + 's';
    box.appendChild(track);
  }

  function renderRank() {
    const done = state.events.filter(e => hasResult(e.id)).length;
    // 띠 전광판 문구: 진행 상황, 현재 경기, 다음 경기 (결과가 없는 종목 순서대로)
    const left = state.events.filter(e => !hasResult(e.id));
    const news = [];
    if (state.events.length === 0) {
      news.push('등록된 종목 없음');
    } else {
      news.push('경기 진행 ' + done + ' / ' + state.events.length + ' 종목');
      if (left.length === 0) {
        news.push('모든 경기 종료 · 최종 순위를 확인하세요');
      } else {
        news.push('현재 진행 중: ' + eventLabel(left[0].id));
        news.push(left.length > 1 ? '다음 경기: ' + eventLabel(left[1].id) + ' (곧 시작)' : '마지막 경기입니다');
      }
    }
    setTicker(news);
    const box = $('total-table');
    box.textContent = '';
    if (state.classes.length === 0) {
      box.appendChild(el('p', { className: 'empty', text: '등록된 반이 없어요.' }));
    } else {
      const totals = computeTotals();
      const top = totals[0].total; // 1등 총점
      const tbody = el('tbody');
      totals.forEach(t => {
        const placeCell = el('td', { className: 'place' });
        fillPlace(placeCell, t.place, t.tied, t.total);
        tbody.appendChild(el('tr', { className: t.place === 1 && t.total > 0 ? 'first' : '', 'data-id': t.id }, [
          placeCell,
          el('td', { className: 'name', text: t.name }),
          el('td', { className: 'num pts-event', text: t.eventPts }),
          el('td', { className: 'num pts-bonus' + (t.bonusPts < 0 ? ' minus' : ''), text: t.bonusPts }),
          el('td', { className: 'num pts-total', text: t.total + '점' }, [
            top > t.total ? el('span', { className: 'gap', text: '(-' + (top - t.total) + '점)' }) : null
          ])
        ]));
      });
      box.appendChild(el('table', null, [
        el('thead', null, [el('tr', null, [
          el('th', { text: '순위' }), el('th', { text: '반' }),
          el('th', { className: 'num', text: '종목 점수' }), el('th', { className: 'num', text: '특별점수' }),
          el('th', { className: 'num', text: '총점' })
        ])]),
        tbody
      ]));
    }

    const evBox = $('event-results');
    evBox.textContent = '';
    if (state.events.length === 0) {
      evBox.appendChild(el('p', { className: 'empty', text: '등록된 종목이 없어요.' }));
      return;
    }
    state.events.forEach(ev => {
      const block = el('div', { className: 'event-block' }, [el('h3', { text: ev.name })]);
      const res = state.results[ev.id] || {};
      const entered = Object.keys(res).filter(cId => className(cId) !== '')
        .sort((a, b) => res[a] - res[b]);
      if (entered.length === 0) {
        block.appendChild(el('p', { className: 'empty', text: '아직 결과가 없어요.' }));
      } else {
        const ol = el('ol');
        entered.forEach(cId => {
          ol.appendChild(el('li', null, [
            el('span', null, [
              el('span', { className: medalClass(res[cId], true), text: res[cId] + '등' }),
              document.createTextNode(' ' + className(cId))
            ]),
            el('span', { className: 'pts', text: pointsFor(res[cId]) + '점' })
          ]));
        });
        block.appendChild(ol);
        const missing = state.classes.filter(c => res[c.id] === undefined).map(c => c.name);
        if (missing.length > 0) block.appendChild(el('p', { className: 'missing', text: '결과 없음: ' + missing.join(', ') }));
      }
      evBox.appendChild(block);
    });
  }

  // ---------- 순위표 애니메이션 ----------
  // 마지막으로 순위표에서 보여준 점수. 순위표에 다시 들어오면 이 점수에서 새 점수로 움직인다.
  let shownTotals = null;
  let animToken = 0; // 다른 화면으로 가면 진행 중인 애니메이션을 멈추는 번호

  function snapshotTotals() {
    const s = {};
    computeTotals().forEach(t => { s[t.id] = { eventPts: t.eventPts, bonusPts: t.bonusPts, total: t.total, place: t.place, tied: t.tied }; });
    return s;
  }

  function animateRank() {
    const token = ++animToken;
    const prev = shownTotals;
    shownTotals = snapshotTotals();
    const now = shownTotals;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prev || reduceMotion) return;

    const rows = Array.from(document.querySelectorAll('#total-table tbody tr'));
    if (rows.length === 0) return;
    const before = id => prev[id] || { eventPts: 0, bonusPts: 0, total: 0, place: null };
    const changed = rows.some(r => {
      const a = before(r.dataset.id), b = now[r.dataset.id];
      return a.total !== b.total || a.eventPts !== b.eventPts || a.bonusPts !== b.bonusPts;
    });
    if (!changed) return;

    // 이전 순서: 이전 총점으로 다시 줄 세운다
    const oldOrder = state.classes.map(c => c.id)
      .sort((x, y) => before(y).total - before(x).total);
    const finalHTML = rows.map(r => r.innerHTML);
    const finalClass = rows.map(r => r.className);

    // 0단계: 이전 순위·점수로 글자를 바꾼다
    rows.forEach(r => {
      const a = before(r.dataset.id);
      r.className = '';
      fillPlace(r.querySelector('.place'), a.place, a.tied, a.total);
      r.querySelector('.pts-event').firstChild.nodeValue = a.eventPts;
      r.querySelector('.pts-bonus').firstChild.nodeValue = a.bonusPts;
      r.querySelector('.pts-total').firstChild.nodeValue = a.total + '점';
      // 1등과의 차이는 애니메이션이 끝난 뒤에 보여준다 (자리는 차지해서 줄 높이는 그대로)
      const gap = r.querySelector('.gap');
      if (gap) gap.style.visibility = 'hidden';
    });
    // 글자를 바꾼 뒤의 줄 높이로, 이전 순서대로 쌓았을 때의 자리를 계산해서 옮겨 놓는다
    const box = {};
    rows.forEach(r => { box[r.dataset.id] = r.getBoundingClientRect(); });
    const oldTop = {};
    let y = box[rows[0].dataset.id].top;
    oldOrder.forEach(id => { oldTop[id] = y; y += box[id] ? box[id].height : 0; });
    rows.forEach(r => {
      r.style.transition = 'none';
      r.style.transform = 'translateY(' + (oldTop[r.dataset.id] - box[r.dataset.id].top) + 'px)';
    });

    const HOLD_MS = 600, COUNT_MS = 1200, GAP_MS = 300, MOVE_MS = 1200;
    const later = (ms, fn) => setTimeout(() => { if (token === animToken) fn(); }, ms);

    // 1단계: 점수가 바뀐 반을 노랗게 표시하고, 숫자가 올라간다
    later(HOLD_MS, () => {
      const start = performance.now();
      const cells = [];
      rows.forEach(r => {
        const a = before(r.dataset.id), b = now[r.dataset.id];
        if (a.total !== b.total) {
          r.classList.add('changed');
          const diff = b.total - a.total;
          const badge = el('span', { className: 'delta', text: (diff > 0 ? '+' : '') + diff });
          if (diff < 0) badge.style.background = 'var(--bad)';
          r.querySelector('.name').appendChild(badge);
        }
        [['.pts-event', 'eventPts', ''], ['.pts-bonus', 'bonusPts', ''], ['.pts-total', 'total', '점']].forEach(([sel, key, unit]) => {
          if (a[key] !== b[key]) {
            const cell = r.querySelector(sel);
            cell.classList.add('bump');
            cells.push({ text: cell.firstChild, from: a[key], to: b[key], unit });
          }
        });
      });
      const tick = t => {
        if (token !== animToken) return;
        const k = Math.min(1, (t - start) / COUNT_MS);
        const ease = 1 - Math.pow(1 - k, 3);
        cells.forEach(c => { c.text.nodeValue = Math.round(c.from + (c.to - c.from) * ease) + c.unit; });
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });

    // 2단계: 새 순위 자리로 위아래 이동 (올라가는 반은 파랗게 떠서 지나간다)
    later(HOLD_MS + COUNT_MS + GAP_MS, () => {
      rows.forEach((r, i) => {
        const oldIdx = oldOrder.indexOf(r.dataset.id);
        if (oldIdx > i) r.classList.add('moving', 'rising');
        fillPlace(r.querySelector('.place'), now[r.dataset.id].place, now[r.dataset.id].tied, now[r.dataset.id].total);
        r.style.transition = 'transform ' + MOVE_MS + 'ms cubic-bezier(.65, 0, .35, 1)';
        r.style.transform = '';
      });
    });

    // 3단계: 원래 모양으로 돌려놓고, 순위가 바뀐 반에 ▲▼ 표시 (계속 보임)
    later(HOLD_MS + COUNT_MS + GAP_MS + MOVE_MS + 50, () => {
      rows.forEach((r, i) => {
        const a = before(r.dataset.id);
        const b = now[r.dataset.id];
        r.style.transition = '';
        r.style.transform = '';
        r.innerHTML = finalHTML[i];
        r.className = finalClass[i];
        if (a.total !== b.total) r.classList.add('changed');
        if (a.place && a.place !== b.place) {
          const up = b.place < a.place;
          r.querySelector('.name').appendChild(el('span', {
            className: 'move ' + (up ? 'up' : 'down'),
            text: (up ? '▲' : '▼') + Math.abs(a.place - b.place)
          }));
        }
      });
      // 노란 표시는 천천히 사라진다
      later(1500, () => rows.forEach(r => r.classList.remove('changed')));
    });
  }

  function renderAll() {
    renderSetup();
    renderInput();
    renderBonus();
    renderRank();
  }

  renderAll();
  shownTotals = snapshotTotals();
</script>
</body>
</html>
